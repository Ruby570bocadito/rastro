name: Bug report
description: Something in Rastro does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected and what you got instead.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: rastro investigate "hxxps://lookalike-domain[.]example/path"
  - type: input
    id: version
    attributes:
      label: Rastro version, Python version and operating system
      description: What `rastro --version` prints.
      placeholder: rastro-osint 0.2.3, Python 3.12.7, Windows 11
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you post
      options:
        - label: I replaced live domain names, link paths and anything that could identify a victim with made-up ones (for example under .example)
          required: true
