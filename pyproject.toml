[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rastro-osint"
dynamic = ["version"]
description = "Paste a phishing link. Watch the whole campaign unfold."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ruby570bocadito" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["phishing", "osint", "threat-intelligence", "certificate-transparency", "rdap", "security"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/Ruby570bocadito/rastro"
Issues = "https://github.com/Ruby570bocadito/rastro/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rastro = "rastro.__main__:main"

[tool.hatch.version]
path = "src/rastro/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rastro"]

[tool.hatch.build.targets.sdist]
# README images stay on GitHub; the package does not need them
exclude = ["docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# experiment scripts build long report lines; the package and tests keep the limit
"experiments/*" = ["E501"]
